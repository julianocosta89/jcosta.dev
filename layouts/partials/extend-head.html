{{/* Consent Banner Styles */}}
<style>
  /* Dark mode (default) */
  .consent-banner {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(10px);
    color: #fff;
    padding: 1.5rem;
    z-index: 9999;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    transform: translateY(100%);
    transition: transform 0.3s ease-out;
  }

  .consent-banner.show {
    transform: translateY(0);
  }

  /* Light mode - when dark class is NOT present on html */
  html:not(.dark) .consent-banner {
    background: rgba(255, 255, 255, 0.95);
    color: #1f2937;
    border-top: 1px solid rgba(0, 0, 0, 0.1);
  }

  html:not(.dark) .consent-banner-text a {
    color: #2563eb;
  }

  html:not(.dark) .consent-banner-btn-decline {
    color: #6b7280;
    border-color: #d1d5db;
  }

  html:not(.dark) .consent-banner-btn-decline:hover {
    background: rgba(0, 0, 0, 0.05);
    color: #1f2937;
  }

  .consent-banner-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .consent-banner-text {
    flex: 1;
    min-width: 250px;
  }

  .consent-banner-text p {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .consent-banner-text a {
    color: #3b82f6;
    text-decoration: underline;
  }

  .consent-banner-buttons {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .consent-banner-btn {
    padding: 0.625rem 1.25rem;
    border: none;
    border-radius: 0.375rem;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    transition: all 0.2s;
  }

  .consent-banner-btn-accept {
    background: #3b82f6;
    color: white;
  }

  .consent-banner-btn-accept:hover {
    background: #2563eb;
  }

  .consent-banner-btn-decline {
    background: transparent;
    color: #9ca3af;
    border: 1px solid #4b5563;
  }

  .consent-banner-btn-decline:hover {
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
  }

  @media (max-width: 768px) {
    .consent-banner-content {
      flex-direction: column;
      align-items: stretch;
    }

    .consent-banner-buttons {
      width: 100%;
    }

    .consent-banner-btn {
      flex: 1;
    }
  }
</style>

{{/* Consent Management and Conditional Dash0 Website Monitoring Initialization */}}
<script>
  (function() {
    const CONSENT_KEY = 'jcosta-analytics-consent';
    const CONSENT_VERSION = '1';
    const CONSENT_EXPIRY_MONTHS = 6;
    const DASH0_SDK_BASE_URL = 'https://unpkg.com/@dash0/sdk-web@0.28.3/dist/';
    const DASH0_ENDPOINT = {{ site.Params.dash0.endpoint }};
    const DASH0_AUTH_TOKEN = {{ site.Params.dash0.authtoken }};

    // Function to load a script from the Dash0 Web SDK distribution
    function loadDash0Script(file, integrity) {
      const script = document.createElement('script');
      script.src = DASH0_SDK_BASE_URL + file;
      script.integrity = integrity;
      script.crossOrigin = 'anonymous';
      script.defer = true;
      script.onerror = function() {
        console.error('Failed to load ' + file);
      };
      document.head.appendChild(script);
    }

    // Function to initialize and load Dash0 Website Monitoring
    function loadDash0() {
      // Skip when Dash0 is not configured
      if (!DASH0_ENDPOINT || !DASH0_AUTH_TOKEN) {
        return;
      }

      // Check if SDK is already initialized
      if (window.dash0) {
        return;
      }

      // Queue API calls until the SDK script is loaded
      (function (d, a, s, h, z, e, r, o) {
        d[a] ||
          ((z = d[a] =
            function () {
              h.push(arguments);
            }),
          (z._t = new Date()),
          (z._v = 1),
          (h = z._q = []));
      })(window, 'dash0');

      window.dash0('init', {
        serviceName: 'jcosta.dev',
        environment: 'prod',
        endpoint: {
          url: DASH0_ENDPOINT,
          authToken: DASH0_AUTH_TOKEN,
        },
        sessionSamplingRate: 100,
        sessionRecording: {
          samplingRate: 10,
          maskAllInputs: true,
        },
      });

      loadDash0Script('dash0.iife.js', 'sha256-gz9sBRgQf978W2xkgHQVKYDzorxhrqN7NXfMnSosE6Y=');
      loadDash0Script('dash0-session-recording.iife.js', 'sha256-V+gbH7R643HKpGclzK7V6P1ZMDOCx3DYSJb0jjbMAgI=');
    }

    // Check for existing consent with expiry
    function getConsent() {
      try {
        const stored = localStorage.getItem(CONSENT_KEY);
        if (stored) {
          const data = JSON.parse(stored);
          const expiryDate = new Date();
          expiryDate.setMonth(expiryDate.getMonth() - CONSENT_EXPIRY_MONTHS);

          if (data.version === CONSENT_VERSION && new Date(data.timestamp) > expiryDate) {
            return data.consent;
          }
          // Consent expired, remove it
          localStorage.removeItem(CONSENT_KEY);
        }
      } catch (e) {
        console.error('Error reading consent:', e);
      }
      return null;
    }

    // Save consent choice
    function saveConsent(accepted) {
      try {
        localStorage.setItem(CONSENT_KEY, JSON.stringify({
          consent: accepted,
          version: CONSENT_VERSION,
          timestamp: new Date().toISOString()
        }));
      } catch (e) {
        console.error('Error saving consent:', e);
      }
    }

    // Show consent banner with focus management
    function showBanner() {
      const banner = document.getElementById('consent-banner');
      if (banner) {
        banner.classList.add('show');

        // Focus the accept button after animation completes
        setTimeout(function() {
          const acceptBtn = document.getElementById('consent-accept');
          if (acceptBtn) {
            acceptBtn.focus();
          }
        }, 300);

        // Trap focus within the banner
        trapFocus(banner);
      }
    }

    // Hide consent banner
    function hideBanner() {
      const banner = document.getElementById('consent-banner');
      if (banner) {
        banner.classList.remove('show');
      }
    }

    // Trap focus within modal for accessibility
    function trapFocus(element) {
      const focusableElements = element.querySelectorAll(
        'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
      );
      const firstFocusable = focusableElements[0];
      const lastFocusable = focusableElements[focusableElements.length - 1];

      element.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
          if (e.shiftKey) {
            if (document.activeElement === firstFocusable) {
              lastFocusable.focus();
              e.preventDefault();
            }
          } else {
            if (document.activeElement === lastFocusable) {
              firstFocusable.focus();
              e.preventDefault();
            }
          }
        }

        // Close on Escape key
        if (e.key === 'Escape') {
          handleConsent(false);
        }
      });
    }

    // Handle user choice
    function handleConsent(accepted) {
      saveConsent(accepted);
      hideBanner();

      if (accepted) {
        loadDash0();
      }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', function() {
      const consent = getConsent();

      if (consent === true) {
        loadDash0();
      } else if (consent === null) {
        showBanner();
      }

      // Attach event listeners
      const acceptBtn = document.getElementById('consent-accept');
      const declineBtn = document.getElementById('consent-decline');

      if (acceptBtn) {
        acceptBtn.addEventListener('click', function() {
          handleConsent(true);
        });
      }

      if (declineBtn) {
        declineBtn.addEventListener('click', function() {
          handleConsent(false);
        });
      }
    });
  })();
</script>
