{{/* Lets visitors review and change their analytics choice. Wired up in partials/extend-head.html. */}}
<div class="not-prose my-6">
  <p data-consent-status class="mb-3" aria-live="polite">Loading your current choice…</p>
  <div class="consent-banner-buttons">
    <button type="button" class="consent-banner-btn consent-banner-btn-accept" data-consent-action="accept">Allow analytics</button>
    <button type="button" class="consent-banner-btn consent-banner-btn-decline" data-consent-action="decline">Decline analytics</button>
  </div>
</div>
