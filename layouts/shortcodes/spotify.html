{{- /* Usage: {{< spotify src="https://open.spotify.com/embed/episode/..." title="..." >}} */ -}}
<div class="spotify-embed" style="border-radius:12px; width:100%">
  <iframe src="{{ .Get "src" }}"
          title="{{ .Get "title" | default (printf "Spotify: %s" .Page.Title) }}"
          width="100%" height="152" style="border:0; border-radius:12px"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy"></iframe>
</div>
